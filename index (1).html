<head>

<title>SuperKita — Satu Aplikasi untuk Semua</title>
<style>
/* ============ TOKENS ============ */
:root{--bg:#f2f5f9;--card:#fff;--ink:#101c26;--mute:#6a7b8a;--line:#e5ebf1;--p:#00b386;--p2:#1c7ed6;--acc:#ffb703;--red:#f04438;--sh:0 10px 30px rgba(15,40,70,.08);

[data-theme=dark]{--bg:#0b1218;--card:#141f29;--ink:#e9f1f7;--mute:#90a3b2;--line:#22323f;--sh:0 10px 30px rgba(0,0,0,.45);--ml:#16212a;--mw:#12354d;--mb:#1b2a35;--mg:rgba(255,255,255,.05);--mr:#2b3d4b;--mt:#9db0be}

html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:left}
:focus-visible{outline:3px solid color-mix(in srgb,var(--p) 55%,transparent);outline-offset:2px}
h1,h2,h3{line-height:1.2}
small{font-size:12px;color:var(--mute)}
s{color:var(--mute);font-size:12px}
/* ============ SHELL ============ */
#shell{min-height:100dvh;display:flex;align-items:center;justify-content:center;gap:56px}
#app{position:relative;width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
#view{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;overscroll-behavior:contain;padding-bottom:12px}
@media(min-width:760px){
 body{background:radial-gradient(900px 500px at 15% 10%,rgba(0,179,134,.22),transparent 60%),radial-gradient(800px 500px at 90% 90%,rgba(28,126,214,.22),transparent 60%),var(--bg)}
 #app{height:min(880px,94dvh);border-radius:38px;box-shadow:0 30px 80px rgba(10,30,60,.28),0 0 0 10px #0f1b26;margin:2dvh 0}
}
/* ============ BASIC UI ============ */

.pad{padding:16px}.muted{color:var(--mute)}.grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.btn{display:block;width:100%;text-align:center;background:var(--grad);color:#fff;border-radius:15px;padding:14px 18px;font-weight:700;font-size:15px;box-shadow:0 8px 20px rgba(0,179,134,.28);transition:transform .15s,filter .15s}
.btn:active{transform:scale(.98)}.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}

.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.chip.on{background:var(--grad);color:#fff;box-shadow:none}
.pill{background:rgba(255,255,255,.2);color:#fff;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700}

.switch{position:relative;width:48px;height:28px;border-radius:99px;background:var(--line);flex:none;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:.2s}
.switch.on{background:var(--p)}.switch.on::after{left:23px}

.map .floating{position:absolute;top:14px;left:14px;z-index:3}
.map text{font-family:inherit;user-select:none}
.panel{position:relative;margin-top:-24px;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 16px 20px;box-shadow:0 -12px 30px rgba(10,30,60,.12);min-height:200px}
.route-box{position:relative;background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:6px 52px 6px 8px}
.rb{display:flex;gap:12px;align-items:center;width:100%;padding:10px 6px}
.rb+.rb{border-top:1px dashed var(--line)}
.rb b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rb>div{min-width:0}
.d{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 20%,transparent)}.d.g{color:var(--p);background:var(--p)}.d.r{color:var(--red);background:var(--red)}
.swap{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:12px;background:color-mix(in srgb,var(--p) 12%,var(--card));text-align:center;font-weight:800;color:var(--p)}
.veh{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);margin-top:8px}
.veh.on{box-shadow:inset 0 0 0 2px var(--p);background:color-mix(in srgb,var(--p) 7%,var(--card))}
.veh .vi{font-size:30px}.veh .pr{margin-left:auto;text-align:right}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.seg button{text-align:center;padding:11px;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;font-size:13px}
.seg button.on{box-shadow:inset 0 0 0 2px var(--p);color:var(--p)}
.pbar{height:7px;border-radius:7px;background:var(--line);overflow:hidden;margin:12px 0}.pbar i{display:block;height:100%;background:var(--grad);border-radius:7px;transition:width .2s linear}
.steps{list-style:none;margin:6px 0}.steps li{display:flex;gap:12px;align-items:center;padding:7px 0;color:var(--mute);font-weight:600;font-size:14px}
.steps li i{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:11px;font-style:normal;color:#fff;flex:none}
.steps li.done{color:var(--ink)}.steps li.done i{background:var(--p)}.steps li.now{color:var(--ink)}.steps li.now i{background:var(--p2);animation:pulse2 1.3s infinite}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(28,126,214,.6)}100%{box-shadow:0 0 0 10px rgba(28,126,214,0)}}
.radar{width:86px;height:86px;border-radius:50%;margin:8px auto;background:radial-gradient(circle,var(--p) 0 22%,transparent 23%);position:relative}
.radar::before,.radar::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--p);animation:radar 1.8s infinite}.radar::after{animation-delay:.9s}
@keyframes radar{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:0}}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:26px;flex:none}
.plate{display:inline-block;background:#111;color:#fff;border-radius:6px;padding:2px 8px;font-weight:800;font-size:12px;letter-spacing:1px}
.stars{display:flex;gap:6px;justify-content:center;margin:8px 0}.stars button{font-size:38px;color:var(--line);text-align:center;line-height:1}.stars button.on{color:var(--acc)}
/* ============ SHOP ============ */
.store{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--sh);width:100%}
.store .im{width:74px;height:74px;border-radius:16px;display:grid;place-items:center;font-size:36px;background:linear-gradient(135deg,color-mix(in srgb,var(--p) 18%,var(--card)),color-mix(in srgb,var(--acc) 22%,var(--card)));flex:none}

.qty{display:flex;align-items:center;gap:10px}.qty button{width:30px;height:30px;border-radius:10px;background:color-mix(in srgb,var(--p) 14%,var(--card));color:var(--p);font-weight:800;font-size:18px;text-align:center;line-height:1}
.add{padding:7px 18px;border-radius:12px;background:var(--grad);color:#fff;font-weight:700;font-size:13px}
.cartbar{position:sticky;bottom:10px;margin:14px 16px 0}
.sum div{display:flex;justify-content:space-between;padding:5px 0}.sum .tot{border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;font-weight:800;font-size:17px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{padding:14px 8px;border-radius:15px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);text-align:center;font-weight:700}
.opt.on{box-shadow:inset 0 0 0 2px var(--p);color:var(--p);background:color-mix(in srgb,var(--p) 7%,var(--card))}

.msgs{display:flex;flex-direction:column;gap:8px;padding:8px 16px;min-height:50dvh}

.vcard{display:flex;background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow:hidden;margin-bottom:12px}

 <div id="app">

 </div>

<script>

/* =====================================================================

/* ---------- Util ---------- */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const rp=n=>(n<0?'-':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ----- CHAT ----- */
const CHATS={cs:[{me:0,t:'Halo! Aku SuperBot 🤖. Ada yang bisa kubantu soal pesanan, saldo, atau promo?'}],driver:[]};
VIEWS.chat={html(){const cs=CHATS.cs,last=cs[cs.length-1];return`<div class="hdr"><h2>Chat</h2></div><div class="pad" style="padding-top:0"><div class="card">${ACTIVE&&ACTIVE.driver?`<button class="li" data-go="chat" data-k="driver"><span class="avatar" style="width:44px;height:44px;font-size:22px">🧑‍✈️</span><div class="grow"><b>${esc(ACTIVE.driver.name)}</b><small>${esc(ACTIVE.title)} · aktif</small></div><span class="tag">Driver</span></button>`:''}<button class="li" data-go="chat" data-k="cs"><span class="ico">🤖</span><div class="grow"><b>Pusat Bantuan SuperKita</b><small>${esc(last.t.slice(0,48))}…</small></div></button></div></div>`}};
VIEWS.chatroom={html(a){const k=a.k==='driver'&&ACTIVE?'driver':'cs',title=k==='driver'?ACTIVE.driver.name:'Pusat Bantuan';
 return hdr(esc(title))+`<div class="msgs" id="msgs">${msgsHtml(k)}</div>${k==='cs'?`<div class="chips" style="padding:0 16px">${['Cara top up','Promo apa saja?','Pesanan terlambat','Batalkan pesanan'].map(q=>`<button class="chip" data-act="quick" data-q="${q}">${q}</button>`).join('')}</div>`:''}<form data-form="chat" class="chatbar" data-k="${k}"><input class="inp" name="m" autocomplete="off" placeholder="Tulis pesan…" aria-label="Pesan"><button aria-label="Kirim">➤</button></form>`},mount(a){const m=$('#msgs');m&&(m.parentElement.scrollTop=m.parentElement.scrollHeight)}};
VIEWS.chat_=VIEWS.chatroom;
const msgsHtml=k=>(CHATS[k].length?CHATS[k]:[{me:0,t:'Halo, saya sudah di jalan ya. Ada pesan khusus?'}]).map(m=>`<div class="msg ${m.me?'me':''}">${esc(m.t)}</div>`).join('');
function botReply(t){t=t.toLowerCase();if(/top ?up|saldo/.test(t))return'Untuk isi saldo, buka Beranda › Top Up, pilih nominal & metode. Saldo masuk otomatis ya 💳';if(/promo|voucher|diskon/.test(t))return'Cek tab Promo untuk klaim voucher terbaru. Pakai di halaman pembayaran ya 🎟️';if(/lambat|telat|lama/.test(t))return'Maaf atas ketidaknyamanannya 🙏 Kamu bisa pantau posisi driver di peta dan chat langsung dengannya.';if(/batal/.test(t))return'Pesanan bisa dibatalkan sebelum driver membawa pesananmu, lewat tombol “Batalkan pesanan” di halaman pelacakan. Dana SuperPay kembali otomatis.';if(/terima kasih|makasih|thanks/.test(t))return'Sama-sama! Senang bisa membantu 💚';return'Terima kasih sudah menghubungi. Bisa jelaskan lebih detail? Kamu juga bisa pilih topik di bawah ini.'}
function chatSend(k,text){CHATS[k].push({me:1,t:text});if(cur().name==='chatroom')render(true);setTimeout(()=>{CHATS[k].push({me:0,t:k==='cs'?botReply(text):pick(['Siap kak, saya segera ke sana 🙏','Baik, saya sudah dekat ya','Oke kak, saya pakai jaket hijau & helm hitam','Mohon ditunggu sebentar ya 🙏','Terima kasih, kak 🙏'])});if(cur().name==='chatroom')render(true)},900+Math.random()*700)}
F.chat=f=>{const v=new FormData(f).get('m').trim();if(!v)return;chatSend(f.dataset.k,v);f.reset()};A.quick=el=>chatSend('cs',el.dataset.q);
/* tombol data-go="chat" membuka ruang chat */
VIEWS.chat.__go=1;const _go=go;go=function(name,args){_go(name==='chat'&&args&&args.k?'chatroom':name,args)};

/* ----- AKUN ----- */
VIEWS.account={html(){const t=tier(),nx=nextTier(),pct=nx?Math.round((S.points-t.min)/(nx.min-t.min)*100):100;
 return`<div class="hdr"><h2>Akun</h2></div><div class="prof"><div class="avatar">🙂</div><div class="grow"><b style="font-size:18px">${esc(S.user.name)}</b><div style="opacity:.9;font-size:13px">${esc(S.user.phone)}</div><div class="bar2"><i style="width:${pct}%"></i></div><small style="color:rgba(255,255,255,.9)">${t.e} ${t.n} · ${S.points} poin${nx?' · '+(nx.min-S.points)+' poin lagi ke '+nx.n:''}</small></div></div>
 <div class="menu card">${[['✏️','Edit profil','go','editprofile'],['📍','Alamat tersimpan','go','addresses'],['⭐','Poin & tukar hadiah','go','points'],['🔔','Notifikasi','go','notifs']].map(m=>`<button class="li" data-go="${m[3]}"><span class="ico">${m[0]}</span><b>${m[1]}</b><span class="go">›</span></button>`).join('')}
 <button class="li" data-act="toggleTheme"><span class="ico">🌙</span><b class="grow">Mode gelap</b><span class="switch ${S.theme==='dark'?'on':''}"></span></button>
 <button class="li" data-act="toggleNotif"><span class="ico">📣</span><b class="grow">Pop-up notifikasi</b><span class="switch ${S.notifOn?'on':''}"></span></button>
 <button class="li" data-go="chat" data-k="cs"><span class="ico">🛟</span><b>Pusat bantuan</b><span class="go">›</span></button><button class="li" data-act="about"><span class="ico">ℹ️</span><b>Tentang aplikasi</b><span class="go">›</span></button><button class="li" data-act="logout"><span class="ico">🚪</span><b style="color:var(--red)">Keluar & hapus data</b></button></div>`}};
A.toggleTheme=()=>{S.theme=S.theme==='dark'?'light':'dark';save();applyTheme();render(true)};A.toggleNotif=()=>{S.notifOn=!S.notifOn;save();render(true)};
A.about=()=>sheet(`<h3>SuperKita v1.0</h3><p class="muted">Aplikasi demo super-app bergaya ride-hailing & e-wallet. Seluruh data (saldo, pesanan, driver) adalah simulasi dan tersimpan hanya di browser kamu.</p><button class="btn" style="margin-top:14px" data-act="close">Tutup</button>`);
A.logout=()=>{if(!confirm('Semua data (saldo, riwayat, voucher) akan dihapus dari perangkat ini. Lanjutkan?'))return;try{localStorage.removeItem(KEY)}catch(e){}S=null;ACTIVE=null;clearInterval(TICK);CART={sid:null,q:{}};LOGIN={step:1,name:'',phone:''};applyTheme();stack=[{name:'login',args:{}}];render()};
VIEWS.editprofile={html(){return hdr('Edit profil')+`<form data-form="profile" class="pad col" style="padding-top:0"><label class="f" for="pn" style="margin:0">Nama</label><input class="inp" id="pn" name="name" required minlength="2" maxlength="40" value="${esc(S.user.name)}"><label class="f" for="pp" style="margin:0">Nomor ponsel</label><input class="inp" id="pp" name="phone" required pattern="0[0-9]{8,13}" value="${esc(S.user.phone)}"><button class="btn" style="margin-top:8px">Simpan</button></form>`}};
F.profile=f=>{const d=new FormData(f);S.user.name=d.get('name').trim();S.user.phone=d.get('phone').trim();save();toast('Profil diperbarui','✅');back()};
VIEWS.addresses={html(){return hdr('Alamat tersimpan')+`<div class="pad" style="padding-top:0"><div class="card">${[['home','🏠','Rumah'],['work','💼','Kantor']].map(a=>`<button class="li" data-act="editAddr" data-w="${a[0]}"><span class="ico">${a[1]}</span><div class="grow"><b>${a[2]}</b><small>${esc(PL[S.saved[a[0]]].n)} · ${esc(PL[S.saved[a[0]]].a)}</small></div><span class="tag">Ubah</span></button>`).join('')}</div></div>`}};
A.editAddr=el=>pickPlace('Pilih lokasi',id=>{S.saved[el.dataset.w]=id;save();toast('Alamat disimpan','📍');render(true)});
VIEWS.points={html(){const t=tier(),nx=nextTier();return hdr('Poin & hadiah')+`<div class="pad" style="padding-top:0"><div class="card" style="text-align:center"><div style="font-size:52px">${t.e}</div><h2>${t.n}</h2><div class="big">${S.points} poin</div><p class="muted">${nx?`${nx.min-S.points} poin lagi menuju ${nx.n}`:'Kamu di tingkat tertinggi!'}</p></div>
 <div class="sec" style="padding-left:0"><h3>Tukar poin</h3></div><div class="card">${[[200,'💰','Saldo SuperPay Rp10.000','bal'],[150,'🍔','Voucher MAKANYUK','MAKANYUK'],[150,'🛵','Voucher RIDEHEMAT','RIDEHEMAT']].map(r=>`<button class="li" data-act="redeem" data-c="${r[0]}" data-w="${r[3]}"><span class="ico">${r[1]}</span><div class="grow"><b>${r[2]}</b><small>${r[0]} poin</small></div><span class="tag ${S.points<r[0]?'red':''}">Tukar</span></button>`).join('')}</div><p class="muted" style="margin-top:10px;font-size:12px">Dapatkan 1 poin untuk setiap Rp1.000 transaksi.</p></div>`}};
A.redeem=el=>{const c=+el.dataset.c;if(S.points<c){toast('Poin belum cukup','⚠️');return}S.points-=c;if(el.dataset.w==='bal')S.balance+=10000;else if(!S.claimed.includes(el.dataset.w))S.claimed.push(el.dataset.w);save();toast('Berhasil ditukar! 🎉','🎁');render(true)};
VIEWS.notifs={enter(){S.notifs.forEach(n=>n.r=1);save()},html(){return hdr('Notifikasi')+`<div class="pad" style="padding-top:0"><div class="card">${S.notifs.length?S.notifs.map(n=>`<div class="li"><span class="ico">${n.ic}</span><div class="grow"><b>${esc(n.h)}</b><small>${esc(n.b)}</small><div><small>${fmtTime(n.t)}</small></div></div></div>`).join(''):'<p class="empty">Belum ada notifikasi</p>'}</div></div>`}};

/* ---------- Boot ---------- */
if(!S)stack=[{name:'login',args:{}}];
applyTheme();render();
if('serviceWorker' in navigator&&false){/* siap untuk PWA */}
</script>
</body>
</html>
